name: magic_device
description: "Gate background work in Flutter: detect mains power (charging), viewer idle and macOS window fullscreen. One import, no setup, no Runner edits."
version: 0.0.2
homepage: https://anilcancakir.com/magic_device
repository: https://github.com/anilcancakir/magic_device
issue_tracker: https://github.com/anilcancakir/magic_device/issues

topics:
  - battery
  - idle
  - power
  - fullscreen
  - magic

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # DevicePower reads the battery through its `batteryState` seam; Battery() is
  # a singleton in battery_plus 7.
  battery_plus: ^7.1.2
  # System-wide user idle on macOS and Windows only, through dart:ffi. Mobile
  # idle falls back to the app lifecycle, which is why it is not the whole
  # signal. No native build step.
  flutter_inactive_timer: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # WindowFullscreen's native half. Every other platform answers
      # `available` false from Dart and never opens the channel.
      macos:
        pluginClass: MagicDevicePlugin
